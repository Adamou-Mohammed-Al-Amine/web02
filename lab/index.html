<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adamou Mohammed Al Amine — Video Editor</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --title-font: 'Playfair Display', serif;
            --body-font: 'Inter', Helvetica, Arial, sans-serif;
            --bg-darker: #000;
            --text-muted: #8a8a8a;
            --accent: #ffffff;
            --title-gradient: linear-gradient(180deg, #ffffff 0%, #e8e8e8 25%, #b0b0b0 55%, #4a4a4a 100%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--body-font);
            background-color: var(--bg-darker);
            color: #fff;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* المظهر العام للهيرو */
        .hero-section {
            position: relative;
            background: radial-gradient(ellipse at 20% 50%, #151515 0%, #000 70%);
            display: flex;
            align-items: center;
            min-height: 100vh;
            width: 100%;
            padding: 0 5%;
        }

        /* النصوص */
        .hero-text-area {
            flex: 1;
            z-index: 10;
            max-width: 650px;
        }

        .gradient-text {
            font-family: var(--title-font);
            font-weight: 900;
            letter-spacing: -0.02em;
            line-height: 0.95;
            font-size: clamp(48px, 6vw, 95px);
            margin-bottom: 25px;
        }

        .gradient-line {
            display: block;
            background: var(--title-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            font-size: 18px;
            color: var(--text-muted);
            line-height: 1.7;
            font-weight: 300;
            margin-bottom: 40px;
        }

        .hero-subtitle strong {
            color: #fff;
            font-weight: 500;
        }

        .hero-cta {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 16px 32px;
            background: #fff;
            color: #000;
            text-decoration: none;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            transition: 0.4s ease;
        }

        .hero-cta:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255,255,255,0.2);
        }

        /* منطقة الصورة (الدائرة والـ me.png) */
        .hero-visual-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            height: 100vh;
        }

        .circle-bg {
            width: clamp(300px, 40vw, 600px);
            height: clamp(300px, 40vw, 600px);
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            border-radius: 50%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
            box-shadow: 0 0 100px rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .profile-img {
            width: 90%;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 20px 50px rgba(0,0,0,0.8));
            z-index: 2;
        }

        /* أنيميشن الظهور */
        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }

        /* Responsive */
        @media (max-width: 992px) {
            .hero-section { flex-direction: column; text-align: center; padding-top: 100px; }
            .hero-visual-area { height: auto; margin-top: 50px; }
            .hero-subtitle { margin-left: auto; margin-right: auto; }
        }
    </style>
</head>
<body>

    <header class="hero-section">
        <div class="hero-text-area">
            <h1 class="gradient-text fade-in">
                <span class="gradient-line">Adamou</span>
                <span class="gradient-line">Mohammed</span>
                <span class="gradient-line">Al Amine</span>
            </h1>
            <p class="hero-subtitle fade-in delay-1">
                Professional <strong>Video Editor</strong> with over <strong>5 years</strong> of experience. 
                Specializing in high-impact <strong>Short-form</strong> content and cinematic <strong>Long-form</strong> storytelling.
            </p>
            <a href="#work" class="hero-cta fade-in delay-2">
                View My Portfolio <span style="margin-left:8px">→</span>
            </a>
        </div>

        <div class="hero-visual-area fade-in">
            <div class="circle-bg">
                <img src="me.png" alt="Adamou Mohammed Al Amine" class="profile-img">
            </div>
        </div>
    </header>

</body>
</html>
