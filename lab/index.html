<!-- ══════════ PORTFOLIO ══════════ -->
<section id="portfolio" class="section" style="background:var(--bg2)">
  <div class="container">
    <div data-aos="fade-up">
      <span class="section-label">My Work</span>
      <h2 class="section-title">Portfolio</h2>
      <p class="section-sub">Every frame crafted with intention. Every cut made with purpose.</p>
    </div>
    <div style="margin-top:40px;" data-aos="fade-up" data-aos-delay="100">
      <div class="portfolio-tabs">
        <button class="tab-btn active" onclick="switchTab('short',this)">📱 Short Form</button>
        <button class="tab-btn" onclick="switchTab('long',this)">🎬 Long Form</button>
      </div>
    </div>
    
    <!-- SHORT FORM TAB -->
    <div class="tab-content active" id="tab-short">
      <div class="videos-grid" id="shortGrid"></div>
    </div>
    
    <!-- LONG FORM TAB - NEW PLAYLIST LAYOUT -->
    <div class="tab-content" id="tab-long">
      <div class="playlist-wrapper">
        <div class="playlist-container">
          <!-- Main Player -->
          <div class="playlist-main" data-aos="fade-right">
            <div class="main-player-wrap">
              <iframe id="mainPlayer" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
            <div class="main-video-info">
              <h3 class="main-video-title" id="mainTitle">Select a video to play</h3>
              <div class="main-video-meta">
                <span class="meta-badge" id="mainBadge">YouTube</span>
                <span class="meta-style" id="mainStyle">—</span>
              </div>
              <p class="main-video-desc" id="mainDesc">Click any video from the playlist to start watching.</p>
              <div class="main-video-stats" id="mainStats"></div>
              <div class="main-video-tags" id="mainTags"></div>
            </div>
          </div>
          
          <!-- Playlist Sidebar -->
          <div class="playlist-sidebar" data-aos="fade-left" data-aos-delay="100">
            <div class="playlist-header">
              <div class="playlist-header-top">
                <h4 class="playlist-title">
                  <span class="playlist-icon">📺</span>
                  Long Form Portfolio
                </h4>
                <span class="playlist-count" id="playlistCount">0 videos</span>
              </div>
              
              <!-- Search & Sort Controls -->
              <div class="playlist-controls">
                <div class="playlist-search">
                  <input type="text" id="playlistSearch" placeholder="🔍 Search videos..." />
                </div>
                <select id="playlistSort" class="playlist-sort">
                  <option value="default">Default Order</option>
                  <option value="title">A-Z Title</option>
                  <option value="views">Most Views</option>
                  <option value="likes">Most Likes</option>
                </select>
              </div>
            </div>
            
            <!-- Video List -->
            <div class="playlist-items" id="playlistItems"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
